name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  msbuild:
    runs-on: windows-2022
    strategy:
      matrix:
        platform: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release
        run: msbuild MFCApplication2.sln /m /p:Configuration=Release /p:Platform=${{ matrix.platform }}
